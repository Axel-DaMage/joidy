[project]
name = "joidy"
version = "1.1.0-beta.8"
description = "Joidy backend services"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    # FastAPI dependency injection idiom: Depends()/Query()/Body() calls in
    # parameter defaults are the framework's documented pattern, not a bug
    # (#994). ~150 occurrences across api/routers and ai-service.
    "B008",
    # raise-without-from-inside-except: pre-existing debt (#994). Fixing the
    # raise sites changes exception chaining semantics, so the site count is
    # pinned by scripts/ruff_budgets.txt and CI-enforced to only shrink
    # (#1264) — fix sites, then lower the budget.
    "B904",
    # replace-str-enum: `(str, PyEnum)` classes back SQLAlchemy Enum columns;
    # switching to StrEnum alters runtime semantics (`.value` lookups,
    # SQLAlchemy Enum handling) — needs its own dedicated PR (#994). Site
    # count pinned in scripts/ruff_budgets.txt like B904 (#1264).
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Intentional star re-exports: models/__init__.py aggregates every ORM model
# (and their import registers them with Base.metadata); database.py pulls the
# same registry.
"api/models/__init__.py" = ["F403"]
"api/database.py" = ["F403"]
# Alembic files follow the generated template layout (imports after the
# module docstring / config block).
"api/alembic/**" = ["E402"]
# Test harnesses configure env/paths (DATABASE_URL, sys.path) before importing
# the app modules under test.
"api/tests/conftest.py" = ["E402"]
"api/tests/test_obsidian_sync.py" = ["E402"]
# Prompt prose must stay verbatim: these lines are LLM system prompts where a
# reflow would alter the exact bytes sent to the model.
"ai-service/clients/prompts.py" = ["E501"]
# github_activity.py embeds a GraphQL document where a reflow would alter the
# query string sent upstream.
"api/services/github_activity.py" = ["E501"]
# Security lint parity with the CI bandit job (ci.yml: `-x api/tests,...`),
# which excludes test dirs entirely: fixtures legitimately hardcode fake
# credentials, bind 0.0.0.0, use /tmp paths and swallow exceptions. The "S"
# ruleset stays fully active for all production code — pre-existing findings
# there are suppressed individually via inline `# noqa: S<n>` justifications.
"**/tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# Flag stale ``# type: ignore`` comments so the 40+ scattered ignores burn
# down together with the module-level baseline (#1264).
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
# CI runs one invocation per service so cwd-relative module names stay unique:
#   cd api         && MYPYPATH=. mypy --explicit-package-bases --config-file ../pyproject.toml .
#   cd ai-service  && MYPYPATH=. mypy --explicit-package-bases --config-file ../pyproject.toml .
#   cd worker      && MYPYPATH=. mypy --explicit-package-bases --config-file ../pyproject.toml .
explicit_package_bases = true

# Baseline (#994, ratcheted in #1264): these modules still carry pre-existing
# typing debt (107 errors total, verified against development @ ae30ffc).
# They are temporarily unchecked so CI fails on NEW errors everywhere else.
#
# RATCHET — this list can only shrink:
#   * scripts/mypy_baseline.txt pins this exact module list; CI fails if the
#     list drifts from it in either direction (grow = new debt sneaked in,
#     shrink = baseline file needs regenerating).
#   * After fixing a module, delete its entry here and regenerate the
#     baseline with `python scripts/check_quality_baselines.py --update`.
# Remaining debt: routers.personal_streaks and the integration services need
# SQLAlchemy Column-vs-value rework (legacy Column() declarations type
# attribute access as Column[T], not T) — tracked per module in #1264.
[[tool.mypy.overrides]]
module = [
    "repositories",
    "routers.integrations.github",
    "routers.personal_streaks",
    "routers.system",
    "services.github_service",
    "services.google_service",
    "tests.test_google_token_service",
    "tests.test_joidy_vault_writer",
    "tests.test_webhook_sync",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "api/tests",
    "ai-service/tests",
    "worker/tests",
]
pythonpath = [
    "api",
    "ai-service",
    "worker"
]
