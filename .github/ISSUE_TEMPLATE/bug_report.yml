name: Bug Report
description: Report a bug or unexpected behavior.
title: '[bug] '
labels: ['bug']
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: >-
        How soon should this be fixed? Maintainers apply the matching
        `priority:P*` label during triage.
      options:
        - Unsure — let maintainers triage
        - P0 — Critical (fix immediately)
        - P1 — High priority
        - P2 — Medium priority
        - P3 — Low priority / backlog
      default: 0
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      description: >-
        What is the impact? Maintainers apply the matching `urgency:*` label
        during triage.
      options:
        - Unsure — let maintainers triage
        - critical — Security vulnerability or data loss risk
        - high — Incorrect behavior, data corruption, memory leaks
        - medium — Important improvement, refactoring, UX issue
        - low — Chore, docs, minor cleanup
        - backlog — Nice-to-have, not currently prioritized
      default: 0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal set of steps that consistently trigger the bug.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Docker version, or anything relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add error messages, logs, or screenshots if available.
    validations:
      required: false
