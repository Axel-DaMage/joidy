# OpenSSF Scorecard — continuous, public supply-chain posture check (#1390).
#
# Results are published to api.scorecard.dev (README badge) and uploaded as
# SARIF to GitHub code scanning (Security tab).
#
# This file follows the official example for public repositories:
# https://github.com/ossf/scorecard-action/blob/v2.6.0/examples/scorecard.yml
#
# IMPORTANT — `publish_results: true` makes the Scorecard API verify THIS
# file on every run and reject the results if it breaks any of the
# "workflow restrictions":
# https://github.com/ossf/scorecard-action#workflow-restrictions
#   - no workflow-level `env:` / `defaults:` and no workflow-level write
#     permissions;
#   - in the `analysis` job: no `env:`, `defaults:`, `container:` or
#     `services:`, an Ubuntu GitHub-hosted runner, and NO `run:` steps —
#     only actions/checkout, actions/upload-artifact,
#     github/codeql-action/upload-sarif, ossf/scorecard-action and
#     step-security/harden-runner are allowed;
#   - only the `analysis` job may hold `id-token: write`.
# Anything else (notifications, summaries, ...) must go in a separate job.
#
# Every action is pinned to a full commit SHA (see #1297); the
# `github-actions` Dependabot ecosystem keeps the pins current.

name: Scorecard supply-chain security

on:
  # For the Branch-Protection check. Only the default branch is supported.
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # Keeps the Maintained check fresh even without pushes (weekly, Sat 05:27 UTC).
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: '27 5 * * 6'
  # Scorecard only analyses/publishes the DEFAULT branch, which in this repo
  # is `development` (`main` is the release branch).
  push:
    branches: [development]
  # Manual re-run (e.g. after hardening work lands). Upstream marks this
  # trigger as experimental; it is not covered by the publish restrictions.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing at workflow level; the job opts in to what it needs.
permissions: {}

# Blocks all Actions cache access for this workflow (nothing here needs it).
# Linters older than the key (actionlint <= v1.7.12) report it as unknown:
# https://github.com/ossf/scorecard-action#workflow-linters
cache-mode: none

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard only supports the default branch (guards manual dispatches
    # from other branches).
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write # Upload SARIF to GitHub code scanning.
      id-token: write # OIDC token that signs results published to api.scorecard.dev.
      contents: read # Checkout. Implicit on a public repo; explicit so a visibility change cannot break it.
      actions: read # upload-sarif reads run metadata; only enforced on private repos.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the Scorecard API: enables the README badge and the
          # public viewer at scorecard.dev.
          publish_results: true
          # Fail loudly if the API rejects the results (i.e. this workflow
          # broke a restriction) instead of silently going stale. API outages
          # (network/408/429/5xx) still only warn.
          # https://github.com/ossf/scorecard-action#when-publishing-fails
          fail_on_publish_error: true

      # results.sarif is written before publishing, so keep both uploads even
      # when the publish step fails.
      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
