name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-flight runs for pull_request events. Push events on
  # main/development queue instead of cancelling, so merge storms keep the
  # post-merge signal for every commit (#1261).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-lint:
    name: API Lint & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Run the test suite against real PostgreSQL + pgvector instead of SQLite.
    # SQLite previously masked PostgreSQL-specific bugs (#398/#399/#400) because
    # the test DB accepted SQLite-only SQL syntax and lacked pgvector (#409).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: joidy
          POSTGRES_PASSWORD: joidy
          POSTGRES_DB: joidy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://joidy:joidy@localhost:5432/joidy_test
      LOG_DIR: logs
      SECRET_KEY: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt', 'api/requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall api ai-service worker cli

      # Real lint gate (#994): ruff (pinned via requirements-dev.txt) fails on
      # violations; baseline exceptions live in pyproject.toml [tool.ruff.lint].
      - name: Ruff lint + format check
        run: |
          ruff check api ai-service worker cli
          ruff format --check api ai-service worker cli

      # Real typecheck gate (#994). One invocation per service so
      # cwd-relative module names (models, services, ...) stay unambiguous;
      # pre-existing debt is baselined in pyproject.toml
      # [[tool.mypy.overrides]] and ratcheted down over time.
      - name: Mypy
        run: |
          (cd api && MYPYPATH=. mypy --explicit-package-bases --config-file ../pyproject.toml .)
          (cd ai-service && MYPYPATH=. mypy --explicit-package-bases --config-file ../pyproject.toml .)
          (cd worker && MYPYPATH=. mypy --explicit-package-bases --config-file ../pyproject.toml .)

      # Ratchet (#1264): scripts/mypy_baseline.txt pins the exact mypy
      # ignore_errors module list (grow = fail, stale = fail) and
      # scripts/ruff_budgets.txt pins site budgets for the globally-ignored
      # ruff rules (B904, UP042). Regenerate after burning debt down:
      #   python scripts/check_quality_baselines.py --update
      - name: Quality baseline ratchet
        run: python scripts/check_quality_baselines.py

      # Migration gate (#994): apply the full chain onto an empty schema and
      # verify at least one downgrade+upgrade round-trip. pgvector must be
      # enabled first (init_db() does this at container start, but nothing
      # enables it for a bare DATABASE_URL).
      - name: Enable pgvector extension
        run: python -c "import os, psycopg2; conn = psycopg2.connect(os.environ['DATABASE_URL'].replace('postgresql+psycopg2://', 'postgresql://')); conn.autocommit = True; conn.cursor().execute('CREATE EXTENSION IF NOT EXISTS vector'); conn.close()"

      - name: Alembic upgrade / downgrade round-trip
        working-directory: api
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run tests with coverage
        working-directory: api
        # -n auto: pytest-xdist parallel run; conftest gives each worker its own
        # joidy_test_gwN database (#996). --durations=20 keeps the slowest-test
        # report in CI output so fixture-time regressions stay visible.
        # Coverage: --cov=. measures everything imported from api/ (modules
        # import as top-level names, so --cov=api matched nothing and coverage
        # was silently empty before #994; see api/.coveragerc, which omits
        # tests/). Floor 80 = measured ~83% on development (CI run
        # 44790581392 and local run, 2026-11-20) rounded down with headroom;
        # ratchet up only. The previous comment claimed floor 85 from a
        # 86.6% measurement (2026-10-31) while the flag was 78 — coverage
        # genuinely regressed below 85; restoring it is tracked in #1401.
        run: python -m pytest tests/ -v -n auto --durations=20 --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      # Hermeticity regression guard (#991): reproduce a real dev environment
      # where .env is fully populated. env_file resolves <repo>/.env on the
      # host while Settings reads <cwd>/.env, so populate both. Without the
      # conftest isolation this step fails ~17 auth/webhook/ws tests.
      - name: Run full suite against a populated .env
        working-directory: api
        run: |
          cp ../.env.example ../.env
          {
            echo "AUTH_PASSWORD=ci-populated-password"
            echo "SECRET_KEY=ci-populated-secret-key"
            echo "OBSIDIAN_WEBHOOK_SECRET=ci-populated-webhook-secret"
            echo "POSTGRES_PASSWORD=joidy"
          } >> ../.env
          cp ../.env .env
          python -m pytest tests/ -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: api/coverage.xml
          retention-days: 30

  # Canonical ai-service test run (#1254): the standalone
  # ai-service-tests.yml workflow was removed — it ran the identical suite
  # a second time per event with a different dep-install path. This job
  # installs requirements-dev.txt (runtime + test tooling) and is the only
  # ai-service check.
  ai-service-test:
    name: AI Service Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: test
      # Tests mock all provider/DB calls; conftest.py also defaults to this,
      # set explicitly so engine creation stays hermetic — no PostgreSQL
      # service is needed for unit tests.
      DATABASE_URL: "sqlite:///:memory:"
      LOG_DIR: logs
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ai-${{ hashFiles('ai-service/requirements.txt', 'ai-service/requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-ai-

      - name: Install ai-service dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Coverage floor (#1259): --cov=. matches the api convention (modules
      # import as top-level names; see ai-service/.coveragerc, which omits
      # tests/). Floor 80 = measured ~83% on development (local run,
      # 2026-11-20) rounded down with headroom; ratchet up only.
      - name: Run ai-service tests
        working-directory: ai-service
        run: python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-ai-service
          path: ai-service/coverage.xml
          retention-days: 30

  frontend-check:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run check

      # ESLint gate (#1257): eslint.config.js used to be dead config — nothing
      # ran it. Pre-existing findings are baselined to warnings in the config
      # (same ratchet pattern as the pyproject.toml mypy overrides), so this
      # step fails only on NEW error-severity violations. Prettier was
      # deliberately removed instead of gated: the tree was never
      # prettier-clean and nothing executed it — dead config.
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm run test:run

  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install CLI + test deps
        run: pip install -e './cli[test]'

      - name: Run CLI unit tests
        # Mocked transport — no stack needed. The live smoke test
        # (cli/tests/test_smoke.py) stays opt-in via JOIDY_SMOKE_API_URL.
        run: python -m pytest cli/tests -v

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Shared definitions (#1254): the 4-image BuildKit build and the
      # env-prep/stack-boot/health-check live in .github/actions so this
      # job and frontend-e2e can never drift apart.
      - name: Build images (BuildKit GHA cache)
        uses: ./.github/actions/build-joidy-images

      - name: Boot dev stack and verify API health
        uses: ./.github/actions/boot-joidy-stack

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down --remove-orphans

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    # Bounded: build + stack boot + suite must finish well under this or the
    # job is killed and reported red.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Shared definitions (#1254): identical image build + stack boot as
      # docker-build via .github/actions — the second job's builds are
      # BuildKit cache hits, so this costs little and the definitions can
      # never drift. extra-env adds the deterministic AUTH_PASSWORD the
      # e2e login helper needs.
      - name: Build images (BuildKit GHA cache)
        uses: ./.github/actions/build-joidy-images

      - name: Boot dev stack and verify API health
        uses: ./.github/actions/boot-joidy-stack
        with:
          extra-env: |
            AUTH_PASSWORD=joidy-e2e-ci

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright (chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Attempt $i/30: frontend not ready yet..."
            sleep 2
          done
          echo "::error::Frontend did not come up within 60 seconds"
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=100 frontend
          exit 1

      # PRs run the smoke spec plus the specs covering the routes the PR
      # touches — src/routes/<dir>/ maps to e2e/<dir>.spec.ts (#1255).
      # Changes to shared frontend code (src/lib, root layout, e2e helpers,
      # playwright config) can affect every route, so they run the full
      # suite. Pushes to main/development always run everything.
      # GEMINI_API_KEY stays unset so the specs exercise the real
      # "AI disabled" path of the CI stack.
      - name: Select e2e specs for changed routes (pull requests)
        if: github.event_name == 'pull_request'
        id: e2e-specs
        working-directory: frontend
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- frontend/ || true)"
          echo "Changed frontend files:"
          echo "${CHANGED:-<none>}"

          SPECS="e2e/smoke.spec.ts"
          RUN_ALL="false"

          # Shared code affects every route — run the full suite.
          if printf '%s\n' "$CHANGED" | grep -qE '^frontend/(src/lib/|src/routes/\+layout|src/hooks|e2e/|playwright\.config\.ts|package(-lock)?\.json)'; then
            RUN_ALL="true"
          fi

          # Map each changed route directory to its spec(s).
          ROUTE_DIRS="$(printf '%s\n' "$CHANGED" | grep -oE '^frontend/src/routes/[^/.+]+' | sed 's|^frontend/src/routes/||' | sort -u || true)"
          for dir in $ROUTE_DIRS; do
            case "$dir" in
              notes)   SPECS="$SPECS e2e/notes.spec.ts e2e/note-editor.spec.ts" ;;
              goals)   SPECS="$SPECS e2e/goals.spec.ts e2e/goal-editor.spec.ts e2e/analytics.spec.ts" ;;
              streaks) SPECS="$SPECS e2e/streaks.spec.ts e2e/streak-interactions.spec.ts" ;;
              *)       [ -f "e2e/${dir}.spec.ts" ] && SPECS="$SPECS e2e/${dir}.spec.ts" ;;
            esac
          done

          # The root page (/) is covered by home + settings specs.
          if printf '%s\n' "$CHANGED" | grep -q '^frontend/src/routes/+page.svelte'; then
            SPECS="$SPECS e2e/home.spec.ts e2e/settings.spec.ts"
          fi

          {
            echo "run_all=$RUN_ALL"
            echo "specs=$SPECS"
          } >> "$GITHUB_OUTPUT"
          echo "Selected specs: ${SPECS:-<all>}"

      - name: Run route-scoped e2e (pull requests)
        if: github.event_name == 'pull_request' && steps.e2e-specs.outputs.run_all != 'true'
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8000
          JOIDY_TEST_PASSWORD: joidy-e2e-ci
        run: npx playwright test ${{ steps.e2e-specs.outputs.specs }}

      - name: Run full e2e suite (branch pushes + shared-code PRs)
        if: github.event_name == 'push' || steps.e2e-specs.outputs.run_all == 'true'
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8000
          JOIDY_TEST_PASSWORD: joidy-e2e-ci
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Stop containers
        if: always()
        # -v drops the postgres volume so the seeded test DB never leaks
        # between runs.
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install security tools
        # Versions match api/requirements-dev.txt so local runs behave the same.
        run: pip install bandit==1.9.4 pip-audit==2.10.1

      # Blocking since #994. -lll/-iii: only HIGH severity AND HIGH confidence
      # findings fail (verified clean on development; LOW/MEDIUM stay visible
      # in output without gating).
      - name: Bandit — Python static analysis
        run: bandit -r api/ ai-service/ worker/ -lll -iii -x api/tests,ai-service/tests,worker/tests

      # Blocking since #994 (verified clean on development). A newly
      # disclosed CVE against a pinned dependency fails CI until the pin is
      # bumped — that is the gate working, not a flake. Keep these pins
      # current.
      - name: pip-audit — API dependencies
        run: pip-audit -r api/requirements.txt

      - name: pip-audit — AI service dependencies
        run: pip-audit -r ai-service/requirements.txt

      - name: pip-audit — Worker dependencies
        run: pip-audit -r worker/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Blocking at HIGH since #1263 (was CRITICAL-only since #994 — that
      # threshold let 9 open HIGH advisories accumulate behind a green
      # pipeline). Tree verified clean at every severity as of 2026-11-20
      # after the minimatch chain bump (eslint 10.15 + typescript-eslint
      # 8.73 pull minimatch 11). MODERATE/LOW disclosures stay advisory;
      # HIGH/CRITICAL fail the job until remediated — that is the gate
      # working, not a flake.
      - name: npm audit — Frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      # Pinned to a tagged release since #994 (was @master — supply-chain
      # risk). ignore-unfixed: skip vulnerabilities with no fixed version
      # available. Filesystem scan (lockfiles + Dockerfiles): verified zero
      # HIGH/CRITICAL findings on development. A newly disclosed CVE fails
      # this job; suppress deliberate, reviewed findings via .trivyignore
      # with a comment linking the tracking issue.
      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Source-mode SBOM preview (#1386): exercises the same scripts publish.yml
  # uses on every PR so a broken generator or a denied license is caught
  # before release night. Manifest files carry sparse license metadata, so
  # the policy check runs --quiet (denied licenses still fail; unknown ones
  # are only counted). The authoritative image-based check runs in the
  # publish workflow.
  sbom:
    name: SBOM & License Policy (source preview)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Generate source SBOMs (SPDX-JSON + CycloneDX-JSON)
        run: ./scripts/generate_sbom.sh --mode source --out-dir sbom

      - name: Enforce license policy
        run: python3 scripts/check_licenses.py --quiet sbom/*.cdx.json

      - name: Generate THIRD-PARTY-NOTICES (preview)
        run: python3 scripts/generate_notices.py --output sbom/THIRD-PARTY-NOTICES.txt sbom/*.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-source-preview
          path: sbom/
          retention-days: 30
