name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  api-lint:
    name: API Lint & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/joidy-test.db
      LOG_DIR: logs
      SECRET_KEY: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall api ai-service worker

      - name: Run tests with coverage
        working-directory: api
        run: python -m pytest tests/ -v --cov=api --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/coverage.xml
          retention-days: 30

  frontend-check:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run check

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          # docker-compose.yml requires a non-empty POSTGRES_PASSWORD (${VAR:?...})
          # .env.example ships it empty, so set a CI-only value here.
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=joidy-ci/' .env
          mkdir -p data/db data/uploads data/vault

      - name: Build and start Docker images
        run: |
          timeout 300 docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d --wait

      - name: Verify API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Attempt $i/30: API not ready yet..."
            sleep 2
          done
          echo "::error::API did not become healthy within 60 seconds"
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=50 api
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down --remove-orphans

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit — Python static analysis
        run: bandit -r api/ ai-service/ worker/ -ll -x api/tests,ai-service/tests,worker/tests

      - name: pip-audit — API dependencies
        run: pip-audit -r api/requirements.txt
        continue-on-error: true

      - name: pip-audit — AI service dependencies
        run: pip-audit -r ai-service/requirements.txt
        continue-on-error: true

      - name: pip-audit — Worker dependencies
        run: pip-audit -r worker/requirements.txt
        continue-on-error: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit — Frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
