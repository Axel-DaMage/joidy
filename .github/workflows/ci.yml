name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-flight runs for pull_request events. Push events on
  # main/development queue instead of cancelling, so merge storms keep the
  # post-merge signal for every commit (#1261). Note GitHub keeps at most
  # ONE pending run per group: while a push run is in progress, newer
  # pushes replace the queued one (they show as "cancelled" — expected),
  # so the latest push is always verified even if intermediate commits
  # are skipped. In-progress push runs are never superseded (#1464).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-lint:
    name: API Lint & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Run the test suite against real PostgreSQL + pgvector instead of SQLite.
    # SQLite previously masked PostgreSQL-specific bugs (#398/#399/#400) because
    # the test DB accepted SQLite-only SQL syntax and lacked pgvector (#409).
    services:
      postgres:
        # Same pgvector release the compose stack is pinned to (#1555).
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: joidy
          POSTGRES_PASSWORD: joidy
          POSTGRES_DB: joidy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://joidy:joidy@localhost:5432/joidy_test
      LOG_DIR: logs
      SECRET_KEY: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt', 'api/requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall api ai-service worker cli

      # Real lint gate (#994): ruff (pinned via requirements-dev.txt) fails on
      # violations; baseline exceptions live in pyproject.toml [tool.ruff.lint].
      - name: Ruff lint + format check
        run: |
          ruff check api ai-service worker cli
          ruff format --check api ai-service worker cli

      # The ruff-pre-commit rev must stay pinned to the same ruff version as
      # requirements-dev.txt so local pre-commit hooks and this gate agree
      # (#1586). Shared script with `make lint` (scripts/lint.sh) so the two
      # call sites can't drift; fails PRs that bump one pin without the other.
      - name: Pre-commit ruff version sync
        run: bash scripts/check_ruff_precommit_sync.sh

      # The per-service requirements-dev.txt files repeat the canonical pins
      # from the repo-root requirements-dev.txt — the pins must live inside
      # each Docker build context, so a shared "-r" include is impossible
      # (#1557). Fails bumps that only edit some copies. Shared with
      # `make lint` (scripts/lint.sh).
      - name: requirements-dev pin sync
        run: bash scripts/check_requirements_dev_sync.sh

      # Real typecheck gate (#994). One invocation per service so
      # cwd-relative module names (models, services, ...) stay unambiguous;
      # pre-existing debt is baselined in pyproject.toml
      # [[tool.mypy.overrides]] and ratcheted down over time.
      - name: Mypy
        run: |
          (cd api && MYPYPATH=. mypy --explicit-package-bases --config-file ../pyproject.toml .)
          (cd ai-service && MYPYPATH=. mypy --explicit-package-bases --config-file ../pyproject.toml .)
          (cd worker && MYPYPATH=. mypy --explicit-package-bases --config-file ../pyproject.toml .)

      # Ratchet (#1264): scripts/mypy_baseline.txt pins the exact mypy
      # ignore_errors module list (grow = fail, stale = fail) and
      # scripts/ruff_budgets.txt pins site budgets for the globally-ignored
      # ruff rules (B904, UP042). Regenerate after burning debt down:
      #   python scripts/check_quality_baselines.py --update
      - name: Quality baseline ratchet
        run: python scripts/check_quality_baselines.py

      # Migration gate (#994): apply the full chain onto an empty schema and
      # verify at least one downgrade+upgrade round-trip. pgvector must be
      # enabled first (init_db() does this at container start, but nothing
      # enables it for a bare DATABASE_URL).
      - name: Enable pgvector extension
        run: python -c "import os, psycopg2; conn = psycopg2.connect(os.environ['DATABASE_URL'].replace('postgresql+psycopg2://', 'postgresql://')); conn.autocommit = True; conn.cursor().execute('CREATE EXTENSION IF NOT EXISTS vector'); conn.close()"

      - name: Alembic upgrade / downgrade round-trip
        working-directory: api
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run tests with coverage
        working-directory: api
        # -n auto: pytest-xdist parallel run; conftest gives each worker its own
        # joidy_test_gwN database (#996). --durations=20 keeps the slowest-test
        # report in CI output so fixture-time regressions stay visible.
        # Coverage: --cov=. measures everything imported from api/ (modules
        # import as top-level names, so --cov=api matched nothing and coverage
        # was silently empty before #994; see api/.coveragerc, which omits
        # tests/). Floor 85 = measured ~91% on this branch (CI run
        # 44814716386, TOTAL 9627 stmts / 841 missed, 2026-11-20) rounded
        # down with headroom; ratchet up only. Restores the documented 85%
        # floor after #1401 lifted coverage back above it.
        run: python -m pytest tests/ -v -n auto --durations=20 --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: api/coverage.xml
          retention-days: 30

  # Hermeticity regression guard (#991), extracted from api-lint (#1553): it
  # re-runs the full suite against a populated .env (a real dev environment).
  # It lived inside api-lint and ran serially after the coverage run — ~2×
  # suite wall-time on one runner — so it is now its own job and executes in
  # parallel. Same postgres service + pip cache as api-lint; conftest creates
  # the per-worker joidy_test_gwN databases, enables the vector extension and
  # builds the schema via Base.metadata.create_all, so no alembic/pgvector
  # steps are needed here.
  api-tests-populated-env:
    name: API Tests (populated .env)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: joidy
          POSTGRES_PASSWORD: joidy
          POSTGRES_DB: joidy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://joidy:joidy@localhost:5432/joidy_test
      LOG_DIR: logs
      SECRET_KEY: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('api/requirements.txt', 'api/requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Hermeticity regression guard (#991): reproduce a real dev environment
      # where .env is fully populated. env_file resolves <repo>/.env on the
      # host while Settings reads <cwd>/.env, so populate both. Without the
      # conftest isolation this step fails ~17 auth/webhook/ws tests.
      - name: Run full suite against a populated .env
        working-directory: api
        run: |
          cp ../.env.example ../.env
          {
            echo "AUTH_PASSWORD=ci-populated-password"
            echo "SECRET_KEY=ci-populated-secret-key"
            echo "OBSIDIAN_WEBHOOK_SECRET=ci-populated-webhook-secret"
            echo "POSTGRES_PASSWORD=joidy"
          } >> ../.env
          cp ../.env .env
          python -m pytest tests/ -q -n auto

  # Canonical ai-service test run (#1254): the standalone
  # ai-service-tests.yml workflow was removed — it ran the identical suite
  # a second time per event with a different dep-install path. This job
  # installs requirements-dev.txt (runtime + test tooling) and is the only
  # ai-service check.
  ai-service-test:
    name: AI Service Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: test
      # Tests mock all provider/DB calls; conftest.py also defaults to this,
      # set explicitly so engine creation stays hermetic — no PostgreSQL
      # service is needed for unit tests.
      DATABASE_URL: "sqlite:///:memory:"
      LOG_DIR: logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ai-${{ hashFiles('ai-service/requirements.txt', 'ai-service/requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-ai-

      - name: Install ai-service dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Coverage floor (#1259): --cov=. matches the api convention (modules
      # import as top-level names; see ai-service/.coveragerc, which omits
      # tests/). Floor 80 = measured ~83% on development (local run,
      # 2026-11-20) rounded down with headroom; ratchet up only.
      - name: Run ai-service tests
        working-directory: ai-service
        run: python -m pytest tests/ -v -n auto --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-ai-service
          path: ai-service/coverage.xml
          retention-days: 30

  frontend-check:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run check

      # ESLint gate (#1257): eslint.config.js used to be dead config — nothing
      # ran it. Pre-existing findings are baselined to warnings in the config
      # (same ratchet pattern as the pyproject.toml mypy overrides), so this
      # step fails only on NEW error-severity violations. Prettier was
      # deliberately removed instead of gated: the tree was never
      # prettier-clean and nothing executed it — dead config.
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm run test:run

  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cli-${{ hashFiles('cli/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-cli-

      - name: Install CLI + test deps
        run: pip install -e './cli[test]'

      - name: Run CLI unit tests
        # Mocked transport — no stack needed. The live smoke test
        # (cli/tests/test_smoke.py) stays opt-in via JOIDY_SMOKE_API_URL.
        run: python -m pytest cli/tests -v

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Shared definitions (#1254): the 4-image BuildKit build and the
      # env-prep/stack-boot/health-check live in .github/actions so this
      # job and frontend-e2e can never drift apart.
      - name: Build images (BuildKit GHA cache)
        uses: ./.github/actions/build-joidy-images

      - name: Boot dev stack and verify API health
        uses: ./.github/actions/boot-joidy-stack

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down --remove-orphans

  # E2E plan (#1464): sizes the frontend-e2e matrix BEFORE any runner boots
  # a stack, so each event pays only for the verification it needs.
  #   - push to main/development: the full suite split across SHARD_COUNT
  #     parallel shards — post-merge verification stays complete, just
  #     parallel (the serial single-worker run hit the 30-min job timeout
  #     and every push run was dying as "cancelled").
  #   - pull_request: smoke + route-scoped specs on a single shard, unless
  #     shared frontend code changed (then the full suite, sharded). Same
  #     src/routes/<dir>/ → e2e/<dir>.spec.ts mapping as before (#1255).
  #   - any event whose diff is docs/metadata-only: e2e is skipped — those
  #     files cannot affect the app (markdown is only ever linked, never
  #     bundled into the frontend).
  e2e-plan:
    name: E2E plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      specs: ${{ steps.plan.outputs.specs }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute e2e scope and shard matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          # GITHUB_TOKEN (auto-provisioned, read-only on forks) is enough
          # for the compare API — no user secrets anywhere in this file.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Full-suite parallelism: N runners, each booting its own
          # docker stack + DB and running ~1/N of the suite serially
          # (workers:1 stays — see playwright.config.ts). Serial runtime
          # exceeded the 30-min timeout on 2026-11-20; measured ~55-60 min
          # across 8 shards on run 44833334196 (~230 tests, 15 specs).
          # 8 shards target ~7-8 min of tests per leg plus ~2.5 min of
          # image/stack/browser setup, keeping headroom for retry
          # inflation when tests fail. If a leg outgrows ~10 min, raise
          # this — do NOT raise workers instead: tests share the shard's
          # API/DB and are only serially safe.
          SHARD_COUNT: '8'
        run: |
          set -euo pipefail

          # Files changed by this event, via the compare API — no git
          # history needed (a depth-1 checkout + depth-1 base fetch has no
          # merge base, so `git diff A...B` fails silently — the old inline
          # version of this logic fell back to smoke on every PR). Empty or
          # failed diff = "unknown" → the safe defaults below run the full
          # suite. Diffs capped at 300 files by the API also count as
          # unknown rather than trusting a truncated list.
          RANGE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [ "${BEFORE//0/}" != "" ]; then
            # push: BEFORE is the previous branch tip (all-zero on a brand
            # new branch, possibly unreachable after a force-push).
            RANGE="${BEFORE}...${HEAD_SHA}"
          fi
          CHANGED=""
          if [ -n "$RANGE" ]; then
            CHANGED="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${RANGE}" \
              --jq 'if ((.files | length) >= 300) then "" else (.files | map(.filename) | join("\n")) end' \
              2>/dev/null || true)"
          fi
          echo "Changed files:"
          echo "${CHANGED:-<unknown>}"

          # Docs/metadata-only changes cannot affect the app — skip e2e.
          # Deliberately conservative: anything under api/, ai-service/,
          # worker/, frontend/, cli/, .github/, compose files, scripts/ or
          # any unlisted path keeps full verification.
          if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qvE \
              '^(docs/|\.reuse/|aur/|LICENSE|NOTICE|CHANGELOG|CODEOWNERS|\.gitignore|\.gitattributes|\.mailmap|\.editorconfig|\.trivyignore|\.pre-commit-config\.yaml|REUSE\.toml)|\.(md|markdown)$'; then
            echo "Docs/metadata-only change — skipping e2e."
            {
              echo "run=false"
              echo "specs="
              # Valid non-empty matrix value; the job-level `if` on `run`
              # skips every leg anyway (avoids empty-matrix edge cases).
              echo "shards=[1]"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SPECS=""
          RUN_ALL="true"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$CHANGED" ]; then
            # Same route-scoping policy the job used to compute inline
            # (#1255): smoke + the specs for touched routes; the full suite
            # when shared frontend code changed. A PR whose diff is
            # unknown stays on the full suite — unknown is never scoped.
            SPECS="e2e/smoke.spec.ts"
            RUN_ALL="false"

            if printf '%s\n' "$CHANGED" | grep -qE '^frontend/(src/lib/|src/routes/\+layout|src/hooks|e2e/|playwright\.config\.ts|package(-lock)?\.json)'; then
              RUN_ALL="true"
            fi

            # CI/action changes can alter how e2e itself runs — self-test
            # with the full suite (#1464).
            if printf '%s\n' "$CHANGED" | grep -qE '^\.github/(workflows/|actions/)'; then
              RUN_ALL="true"
            fi

            ROUTE_DIRS="$(printf '%s\n' "$CHANGED" | grep -oE '^frontend/src/routes/[^/.+]+' | sed 's|^frontend/src/routes/||' | sort -u || true)"
            for dir in $ROUTE_DIRS; do
              case "$dir" in
                notes)   SPECS="$SPECS e2e/notes.spec.ts e2e/note-editor.spec.ts" ;;
                goals)   SPECS="$SPECS e2e/goals.spec.ts e2e/goal-editor.spec.ts e2e/analytics.spec.ts" ;;
                streaks) SPECS="$SPECS e2e/streaks.spec.ts e2e/streak-interactions.spec.ts" ;;
                *)       [ -f "frontend/e2e/${dir}.spec.ts" ] && SPECS="$SPECS e2e/${dir}.spec.ts" ;;
              esac
            done

            # The root page (/) is covered by home + settings specs.
            if printf '%s\n' "$CHANGED" | grep -q '^frontend/src/routes/+page.svelte'; then
              SPECS="$SPECS e2e/home.spec.ts e2e/settings.spec.ts"
            fi
          fi

          if [ "$RUN_ALL" = "true" ]; then
            SHARDS="$(seq -s, 1 "$SHARD_COUNT")"
            echo "Full suite across $SHARD_COUNT shards."
            {
              echo "run=true"
              echo "specs="
              echo "shards=[$SHARDS]"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Route-scoped specs on one shard: $SPECS"
            {
              echo "run=true"
              echo "specs=$SPECS"
              echo "shards=[1]"
            } >> "$GITHUB_OUTPUT"
          fi

  frontend-e2e:
    name: Frontend E2E (Playwright)
    needs: e2e-plan
    if: needs.e2e-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Bounded per shard: image build + stack boot + the shard's share of
    # the suite must finish well under this or the leg is killed and
    # reported red.
    timeout-minutes: 30
    strategy:
      # fail-fast off: a red shard must not hide the other shards' results
      # — partial signal is what makes shard flakes diagnosable.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Shared definitions (#1254): identical image build + stack boot as
      # docker-build via .github/actions — every shard's build is a
      # BuildKit GHA cache hit (~1 min for all 4 images), so this costs
      # little and the definitions can never drift. extra-env adds the
      # deterministic AUTH_PASSWORD the e2e login helper needs.
      - name: Build images (BuildKit GHA cache)
        uses: ./.github/actions/build-joidy-images

      - name: Boot dev stack and verify API health
        uses: ./.github/actions/boot-joidy-stack
        with:
          extra-env: |
            AUTH_PASSWORD=joidy-e2e-ci

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Browsers are version-pinned by package-lock — caching the browser
      # binaries skips the download on every shard; install --with-deps
      # still runs to guarantee system libraries (cheap when up to date).
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright (chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Attempt $i/30: frontend not ready yet..."
            sleep 2
          done
          echo "::error::Frontend did not come up within 60 seconds"
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=100 frontend
          exit 1

      # --shard=n/M makes Playwright run only this leg's share of the
      # suite — each shard owns an isolated stack + DB, so tests stay
      # serially safe (workers:1) while the suite runs M× faster.
      # e2e-plan emits specs only for route-scoped PR runs (shard=1/1 then,
      # so --shard is a no-op); empty specs = whole suite. GEMINI_API_KEY
      # stays unset so specs exercise the real "AI disabled" path.
      - name: Run e2e suite (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8000
          JOIDY_TEST_PASSWORD: joidy-e2e-ci
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} ${{ needs.e2e-plan.outputs.specs }}

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Per-shard name: upload-artifact v4+ rejects duplicate artifact
          # names across parallel matrix legs.
          name: playwright-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Stop containers
        if: always()
        # -v drops the postgres volume so the seeded test DB never leaks
        # between runs (each shard gets a pristine stack anyway).
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v --remove-orphans

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          # Keyed on requirements-dev.txt: the tool pins below are required
          # to match it, so a version bump there busts this cache too.
          key: ${{ runner.os }}-pip-security-${{ hashFiles('api/requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-security-

      - name: Install security tools
        # Pins come from the repo-root requirements-dev.txt (canonical
        # dev-tool pins, #1557) so local runs and CI install identical
        # versions — no hand-mirrored pins here.
        run: pip install -c requirements-dev.txt bandit pip-audit

      # Blocking since #994. -lll/-iii: only HIGH severity AND HIGH confidence
      # findings fail (verified clean on development; LOW/MEDIUM stay visible
      # in output without gating).
      - name: Bandit — Python static analysis
        run: bandit -r api/ ai-service/ worker/ -lll -iii -x api/tests,ai-service/tests,worker/tests

      # Blocking since #994 (verified clean on development). A newly
      # disclosed CVE against a pinned dependency fails CI until the pin is
      # bumped — that is the gate working, not a flake. Keep these pins
      # current.
      - name: pip-audit — API dependencies
        run: pip-audit -r api/requirements.txt

      - name: pip-audit — AI service dependencies
        run: pip-audit -r ai-service/requirements.txt

      - name: pip-audit — Worker dependencies
        run: pip-audit -r worker/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Blocking at HIGH since #1263 (was CRITICAL-only since #994 — that
      # threshold let 9 open HIGH advisories accumulate behind a green
      # pipeline). Tree verified clean at every severity as of 2026-11-20
      # after the minimatch chain bump (eslint 10.15 + typescript-eslint
      # 8.73 pull minimatch 11). MODERATE/LOW disclosures stay advisory;
      # HIGH/CRITICAL fail the job until remediated — that is the gate
      # working, not a flake.
      - name: npm audit — Frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      # Pinned to a tagged release since #994 (was @master — supply-chain
      # risk). ignore-unfixed: skip vulnerabilities with no fixed version
      # available. Filesystem scan (lockfiles + Dockerfiles): verified zero
      # HIGH/CRITICAL findings on development. A newly disclosed CVE fails
      # this job; suppress deliberate, reviewed findings via .trivyignore
      # with a comment linking the tracking issue.
      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Source-mode SBOM preview (#1386): exercises the same scripts publish.yml
  # uses on every PR so a broken generator or a denied license is caught
  # before release night. Manifest files carry sparse license metadata, so
  # the policy check runs --quiet (denied licenses still fail; unknown ones
  # are only counted). The authoritative image-based check runs in the
  # publish workflow.
  sbom:
    name: SBOM & License Policy (source preview)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Single source of truth for the pin: scripts/generate_sbom.sh honors
      # SYFT_VERSION, and the binary cache key below uses the same value, so
      # a version bump invalidates the cache automatically.
      SYFT_VERSION: '1.57.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runners ship a Docker daemon, so generate_sbom.sh used to take
      # its docker branch and pull the ~200MB anchore/syft image on every
      # run (#1553). Instead we cache the ~10MB release binary and put it on
      # PATH — the script's first resolution branch (`command -v syft`)
      # picks it up, and the docker/image path still works locally.
      - name: Cache syft binary
        id: syft
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/syft
          key: ${{ runner.os }}-syft-v${{ env.SYFT_VERSION }}

      # Same download + sha256-verify flow as generate_sbom.sh install_syft().
      - name: Install syft binary (sha256-verified)
        if: steps.syft.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tarball="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          curl -fsSL -o "$tmp/$tarball" "$base/$tarball"
          curl -fsSL -o "$tmp/checksums.txt" "$base/syft_${SYFT_VERSION}_checksums.txt"
          (cd "$tmp" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          mkdir -p ~/.cache/syft
          tar -xzf "$tmp/$tarball" -C ~/.cache/syft syft

      - name: Generate source SBOMs (SPDX-JSON + CycloneDX-JSON)
        run: PATH="$HOME/.cache/syft:$PATH" ./scripts/generate_sbom.sh --mode source --out-dir sbom

      - name: Enforce license policy
        run: python3 scripts/check_licenses.py --quiet sbom/*.cdx.json

      - name: Generate THIRD-PARTY-NOTICES (preview)
        run: python3 scripts/generate_notices.py --output sbom/THIRD-PARTY-NOTICES.txt sbom/*.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-source-preview
          path: sbom/
          retention-days: 30

  # Version single-source gate (#1554): the root VERSION file is canonical
  # (#1258) and `release_bump.sh --check` asserts every dependent agrees —
  # pyproject.toml, frontend package.json + lockfile, aur/PKGBUILD +
  # .SRCINFO, docker-compose.release.yml image pins, README badge, pinned
  # installer URLs, docs metadata, CHANGELOG compare link. release.yml runs
  # the identical assertion at tag time; running it here catches drift on
  # regular commits instead of on release night. Pure bash/grep — no deps.
  # Deliberately not duplicated: dist-smoke.yml already asserts
  # aur/.SRCINFO matches `makepkg --printsrcinfo`.
  # Legitimate exception: cli/pyproject.toml + joidy_cli.__version__ are the
  # independently-versioned `joidy-cli` package — the release flow does not
  # own them.
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert all version strings match VERSION
        run: bash scripts/release_bump.sh --check "$(cat VERSION)"
