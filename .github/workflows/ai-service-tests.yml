name: AI Service Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service:
    name: AI Service Unit Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      # Tests mock all provider/DB calls; SQLite keeps engine creation cheap
      # and hermetic (no PostgreSQL service needed for unit tests).
      DATABASE_URL: "sqlite:///:memory:"
      LOG_DIR: logs
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ai-${{ hashFiles('ai-service/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-ai-

      - name: Install ai-service dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q ai-service

      - name: Run ai-service tests
        working-directory: ai-service
        run: python -m pytest tests/ -v
