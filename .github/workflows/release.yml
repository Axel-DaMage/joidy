name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.0, v0.2.1-alpha.1). Leave empty to auto-bump.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release (alpha/beta/rc)'
        type: boolean
        required: false
        default: true

# Fail closed: every job must declare its own permissions explicitly.
permissions: {}

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate dispatch inputs
        env:
          # Inputs mapped to env — ${{ }} interpolation inside run: expands
          # before the shell parses the line, so a crafted input could break
          # quoting and inject arbitrary commands (#1295).
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Repo tags are always 'vMAJOR.MINOR.PATCH' with optional
          # '-prerelease.N' suffix (e.g. v1.1.0-beta.8).
          if [ -n "$INPUT_VERSION" ] && [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid version '$INPUT_VERSION' — expected a tag like v1.2.3 or v1.2.3-beta.4"
            exit 1
          fi
          if [ -n "$INPUT_PRERELEASE" ] && [[ ! "$INPUT_PRERELEASE" =~ ^(true|false)$ ]]; then
            echo "::error::Invalid prerelease value '$INPUT_PRERELEASE' — expected true or false"
            exit 1
          fi
          echo "Dispatch inputs are valid"

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Auto-bump: find the latest tag overall (including pre-releases).
            # If the latest tag is a pre-release (contains `-`), continue the
            # pre-release series by incrementing the pre-release counter
            # (e.g. v1.0.0-beta.3 → v1.0.0-beta.4). This avoids creating
            # spurious stable releases when pre-release content is merged to
            # main — use workflow_dispatch with an explicit version to
            # graduate from a pre-release to a stable release.
            # If the latest tag is a stable release (no `-`), bump the patch
            # as before (e.g. v0.1.2 → v0.1.3).
            LATEST=$(git tag -l 'v[0-9]*' | sort -V | tail -1)
            if [ -z "$LATEST" ]; then
              VERSION="v0.1.0"
            elif echo "$LATEST" | grep -q '-'; then
              # Pre-release tag: increment the pre-release counter.
              # Format: vMAJOR.MINOR.PATCH-PRETYPE.N (e.g. v1.0.0-beta.3)
              BASE="${LATEST#v}"
              PRE_CORE=$(echo "$BASE" | sed 's/-.*//')
              PRE_TYPE=$(echo "$BASE" | sed 's/.*-\([a-zA-Z]*\)\.[0-9]*/\1/')
              PRE_COUNTER=$(echo "$BASE" | sed 's/.*-[a-zA-Z]*\.\([0-9]*\)/\1/')
              PRE_COUNTER=$((PRE_COUNTER + 1))
              VERSION="v${PRE_CORE}-${PRE_TYPE}.${PRE_COUNTER}"
            else
              # Stable tag: strip leading 'v' and bump the patch version.
              BASE="${LATEST#v}"
              MAJOR=$(echo "$BASE" | cut -d. -f1)
              MINOR=$(echo "$BASE" | cut -d. -f2)
              PATCH=$(echo "$BASE" | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          VERSION_CLEAN="${VERSION#v}"
          echo "version_clean=${VERSION_CLEAN}" >> "$GITHUB_OUTPUT"
          # Auto-detect prerelease: anything with a hyphen suffix (alpha/beta/rc)
          # is a pre-release. Manual dispatch can override via input.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PRERELEASE="$INPUT_PRERELEASE"
          else
            case "$VERSION" in
              *-*) PRERELEASE=true ;;
              *) PRERELEASE=false ;;
            esac
          fi
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Bump version strings
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Single-source versioning (#1258): VERSION is canonical;
          # scripts/release_bump.sh regenerates every dependent —
          # VERSION itself, pyproject.toml, frontend package.json +
          # lockfile, aur/PKGBUILD + makepkg-generated .SRCINFO,
          # docker-compose.release.yml, README badge, pinned installer
          # URLs, docs metadata, CHANGELOG compare link — and verifies
          # they all agree before returning. No more per-file seds.
          bash scripts/release_bump.sh "$VERSION"
          git diff --stat

      - name: Verify version consistency
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Post-bump assertion (#1258): fail loudly if any versioned file
          # disagrees with the release version — the silent-drift failure
          # mode this replaces used to ship wrong versions to users.
          bash scripts/release_bump.sh --check "$VERSION"

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if ! git diff --quiet --cached; then
            git commit -m "chore: bump version strings to ${VERSION}"
            git push
          fi

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Tag the commit with the version bump.
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Inject release checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The tag now exists — download the exact source tarball users
          # (and makepkg on AUR installs) will fetch and record its sha256
          # (#1296, #1394). Retry: GitHub generates the archive on first
          # request, so a brand-new tag can 404 briefly.
          TARBALL_URL="https://github.com/Axel-DaMage/joidy/archive/${VERSION}.tar.gz"
          echo "Computing sha256 of ${TARBALL_URL}"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL "$TARBALL_URL" -o /tmp/joidy-src.tar.gz; then
              ok=1
              break
            fi
            echo "Download attempt $i failed — retrying in 10s..."
            sleep 10
          done
          if [ "$ok" != "1" ] || [ ! -s /tmp/joidy-src.tar.gz ]; then
            echo "::error::Could not download ${TARBALL_URL} after 5 attempts"
            exit 1
          fi
          TARBALL_SHA=$(sha256sum /tmp/joidy-src.tar.gz | cut -d' ' -f1)
          INSTALL_SHA=$(sha256sum aur/joidy.install | cut -d' ' -f1)
          if [[ ! "$TARBALL_SHA" =~ ^[0-9a-f]{64}$ ]] || [[ ! "$INSTALL_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to compute valid sha256 checksums"
            exit 1
          fi

          # Inject the real sums into the repo copies of the AUR files so
          # main carries verifiable checksums even though the tagged commit
          # itself must keep SKIP (a tag cannot contain its own tarball hash).
          sed -i "s|^sha256sums=(.*|sha256sums=('${TARBALL_SHA}' '${INSTALL_SHA}')|" aur/PKGBUILD
          awk -v tarball="${TARBALL_SHA}" -v install="${INSTALL_SHA}" '
            /^\tsha256sums = / {
              n++
              $0 = "\tsha256sums = " (n == 1 ? tarball : install)
            }
            { print }
          ' aur/.SRCINFO > aur/.SRCINFO.new && mv aur/.SRCINFO.new aur/.SRCINFO
          grep -n 'sha256sums' aur/PKGBUILD aur/.SRCINFO

          git add aur/PKGBUILD aur/.SRCINFO
          if ! git diff --quiet --cached; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git commit -m "chore: inject AUR source sha256sums for ${VERSION}"
            # Same credentials as the version-bump push (GITHUB_TOKEN) —
            # pushes made with it do not retrigger this workflow.
            git push
          fi

          # SHA256SUMS.txt covers every file end users download: the source
          # tarball, the one-shot installers and the pinned compose overlay.
          mkdir -p release-assets
          awk -v sha="${TARBALL_SHA}" -v name="${VERSION}.tar.gz" \
            'BEGIN { print sha "  " name }' > release-assets/SHA256SUMS.txt
          (cd scripts && sha256sum install.sh install.ps1) >> release-assets/SHA256SUMS.txt
          sha256sum docker-compose.release.yml >> release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Create release
        env:
          # GH_PAT should be a fine-grained PAT scoped to Axel-DaMage/joidy
          # (and Axel-DaMage/homebrew-tap, also consumed by publish.yml)
          # with "Contents: Read and write" — not a classic PAT (#1297).
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          ARGS=(--title "Joidy ${VERSION}" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$VERSION" "${ARGS[@]}" \
            release-assets/SHA256SUMS.txt \
            docker-compose.release.yml
          # Prepend pre-release warning (gh CLI on runners doesn't support --notes-prepend)
          if [ "$PRERELEASE" = "true" ]; then
            PREPEND=$(printf '## ⚠️ Pre-Release — Non-Production Ready\n\nThis is a **pre-release**. Expect breaking changes, bugs, and incomplete features. Do **not** use in production.\n\n')
            BODY=$(gh release view "$VERSION" --json body -q .body)
            gh release edit "$VERSION" --notes "${PREPEND}${BODY}"
          fi
