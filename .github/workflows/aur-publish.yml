# Requires the `AUR_SSH_KEY` secret — an SSH private key authorized
# to push to the AUR package `joidy` (ssh://aur@aur.archlinux.org/joidy.git).
# Generate one: ssh-keygen -t ed25519 -f aur_key -C "github-actions-joidy"
# Add the public key to your AUR account: https://aur.archlinux.org/account/...
# Add the private key as a repository secret: AUR_SSH_KEY
name: Publish AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v1.0.0-beta.3). Leave empty to use latest release.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    name: Publish to AUR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate dispatch inputs
        env:
          # Input mapped to env — ${{ }} interpolation inside run: expands
          # before the shell parses the line, so a crafted version string
          # could break quoting and inject arbitrary commands (#1295).
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Repo tags are always 'vMAJOR.MINOR.PATCH' with optional
          # '-prerelease.N' suffix (e.g. v1.1.0-beta.8).
          if [ -n "$INPUT_VERSION" ] && [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid version '$INPUT_VERSION' — expected a tag like v1.2.3 or v1.2.3-beta.4"
            exit 1
          fi
          echo "Dispatch inputs are valid"

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing AUR package for ${VERSION}"

      - name: Verify AUR files are up to date
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION_CLEAN="${VERSION#v}"
          VERSION_AUR="${VERSION_CLEAN//-/_}"
          PKGBUILD_VER=$(grep '^pkgver=' aur/PKGBUILD | cut -d= -f2)
          if [ "$PKGBUILD_VER" != "$VERSION_AUR" ]; then
            echo "::error::aur/PKGBUILD pkgver ($PKGBUILD_VER) does not match release version ($VERSION_AUR)"
            echo "The release workflow should have updated these files. Check release.yml."
            exit 1
          fi
          echo "AUR files are up to date (pkgver=$PKGBUILD_VER)"

      - name: Configure SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          echo "Host aur.archlinux.org" >> ~/.ssh/config
          echo "  HostName aur.archlinux.org" >> ~/.ssh/config
          echo "  User aur" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/aur_key" >> ~/.ssh/config
          echo "  IdentitiesOnly yes" >> ~/.ssh/config
          # Host-key verification stays ON (#1296): StrictHostKeyChecking
          # defaults to yes and known_hosts is populated by ssh-keyscan. A
          # MITM impersonating aur.archlinux.org now fails the push instead of
          # silently accepting a forged host key.
          echo "  StrictHostKeyChecking yes" >> ~/.ssh/config
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan returned no host keys for aur.archlinux.org — refusing to push unverified"
            exit 1
          fi

      - name: Compute source checksums
        id: checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # sha256 of the exact tarball makepkg will download from the AUR
          # PKGBUILD source=() (#1296, #1394). Retry: GitHub generates the
          # archive on first request, so a brand-new tag can 404 briefly.
          TARBALL_URL="https://github.com/Axel-DaMage/joidy/archive/${VERSION}.tar.gz"
          echo "Computing sha256 of ${TARBALL_URL}"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL "$TARBALL_URL" -o /tmp/joidy-src.tar.gz; then
              ok=1
              break
            fi
            echo "Download attempt $i failed — retrying in 10s..."
            sleep 10
          done
          if [ "$ok" != "1" ] || [ ! -s /tmp/joidy-src.tar.gz ]; then
            echo "::error::Could not download ${TARBALL_URL} after 5 attempts"
            exit 1
          fi
          TARBALL_SHA=$(sha256sum /tmp/joidy-src.tar.gz | cut -d' ' -f1)
          INSTALL_SHA=$(sha256sum aur/joidy.install | cut -d' ' -f1)
          if [[ ! "$TARBALL_SHA" =~ ^[0-9a-f]{64}$ ]] || [[ ! "$INSTALL_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to compute valid sha256 checksums"
            exit 1
          fi
          echo "tarball_sha256=${TARBALL_SHA}" >> "$GITHUB_OUTPUT"
          echo "install_sha256=${INSTALL_SHA}" >> "$GITHUB_OUTPUT"
          echo "tarball sha256:      ${TARBALL_SHA}"
          echo "joidy.install sha256: ${INSTALL_SHA}"

      - name: Publish to AUR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL_SHA256: ${{ steps.checksums.outputs.tarball_sha256 }}
          INSTALL_SHA256: ${{ steps.checksums.outputs.install_sha256 }}
        run: |
          # Clone the AUR repo (host key verified against ~/.ssh/known_hosts
          # via the ssh config written above — no GIT_SSH_COMMAND override).
          git clone "ssh://aur@aur.archlinux.org/joidy.git" /tmp/aur
          cd /tmp/aur
          git checkout -B master origin/master

          # Configure git
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Copy updated files from the joidy repo
          cp "$GITHUB_WORKSPACE/aur/PKGBUILD" .
          cp "$GITHUB_WORKSPACE/aur/.SRCINFO" .
          cp "$GITHUB_WORKSPACE/aur/joidy.install" .

          # Inject the real sha256sums computed in the previous step (#1296,
          # #1394). A tagged PKGBUILD can never contain its own tarball hash
          # (the artifact only exists after the tag is pushed), so the sums
          # are always (re)injected at publish time from the live tarball
          # makepkg will fetch — even when the checkout predates the fix.
          sed -i "s|^sha256sums=(.*|sha256sums=('${TARBALL_SHA256}' '${INSTALL_SHA256}')|" PKGBUILD
          awk -v tarball="${TARBALL_SHA256}" -v install="${INSTALL_SHA256}" '
            /^\tsha256sums = / {
              n++
              $0 = "\tsha256sums = " (n == 1 ? tarball : install)
            }
            { print }
          ' .SRCINFO > .SRCINFO.new && mv .SRCINFO.new .SRCINFO
          grep -n 'sha256sums' PKGBUILD .SRCINFO

          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to AUR package — already up to date"
            exit 0
          fi

          # Commit and push
          git add PKGBUILD .SRCINFO joidy.install
          git commit -m "Update to ${VERSION}"
          git push origin master

          echo "Published joidy ${VERSION} to AUR"

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/aur_key
          rm -f ~/.ssh/config
