name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: ''
      pkgrel:
        description: 'AUR package release number'
        required: false
        default: '1'

# Fail closed: every job must declare its own permissions explicitly.
permissions: {}

jobs:
  docker:
    name: Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [api, frontend, ai-service, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/joidy-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  homebrew:
    name: Homebrew
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.version != ''
    permissions:
      contents: read
    env:
      # Input mapped to env — ${{ }} interpolation inside run: expands
      # before the shell parses the line, so a crafted version string could
      # break quoting and inject arbitrary commands (#1295).
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate version
        # Repo tags are always 'vMAJOR.MINOR.PATCH' with optional
        # '-prerelease.N' suffix (e.g. v1.1.0-beta.8).
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid version '$VERSION' — expected a tag like v1.2.3 or v1.2.3-beta.4"
            exit 1
          fi
          echo "Version '$VERSION' is valid"
      - name: Update homebrew-tap formula
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          SHA=$(curl -sL "https://github.com/Axel-DaMage/joidy/archive/refs/tags/${VERSION}.tar.gz" | sha256sum | cut -d' ' -f1)
          git clone "https://x-access-token:${GH_PAT}@github.com/Axel-DaMage/homebrew-tap.git"
          cd homebrew-tap
          sed -i "s|url \".*\"|url \"https://github.com/Axel-DaMage/joidy/archive/refs/tags/${VERSION}.tar.gz\"|" Formula/joidy.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/joidy.rb
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Formula/joidy.rb
          git diff --quiet HEAD || {
            git commit -m "joidy ${VERSION}"
            git push
          }

  # NOTE: AUR publishing lives in aur-publish.yml (release + workflow_dispatch).
  # It used to be duplicated here and both jobs raced on the same AUR repo —
  # the loser's push was rejected non-fast-forward and the release showed a
  # spurious failure (v1.1.0-beta.6). Keep AUR updates in ONE place.
