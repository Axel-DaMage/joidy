name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: ''
      pkgrel:
        description: 'AUR package release number'
        required: false
        default: '1'

# Fail closed: every job must declare its own permissions explicitly.
permissions: {}

jobs:
  docker:
    name: Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [api, frontend, ai-service, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/joidy-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          # Supply-chain metadata on published images (#1394). source and
          # revision are also emitted by metadata-action defaults; they are
          # pinned explicitly so the label set does not depend on the action's
          # implicit behavior.
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/Axel-DaMage/joidy
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Axel-DaMage
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations (#1297): BuildKit attaches SLSA
          # provenance + SBOM manifests as OCI referrers on every pushed
          # tag — consumers verify with `docker buildx imagetools inspect`
          # or `cosign verify-attestation`. Only meaningful on push:true;
          # the CI smoke builds in .github/actions/build-joidy-images use
          # load:true and correctly omit these.
          provenance: true
          sbom: true

  homebrew:
    name: Homebrew
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.version != ''
    permissions:
      contents: read
    env:
      # Input mapped to env — ${{ }} interpolation inside run: expands
      # before the shell parses the line, so a crafted version string could
      # break quoting and inject arbitrary commands (#1295).
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate version
        # Repo tags are always 'vMAJOR.MINOR.PATCH' with optional
        # '-prerelease.N' suffix (e.g. v1.1.0-beta.8).
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid version '$VERSION' — expected a tag like v1.2.3 or v1.2.3-beta.4"
            exit 1
          fi
          echo "Version '$VERSION' is valid"
      - name: Update homebrew-tap formula
        env:
          # GH_PAT is also consumed by release.yml (`gh release create`).
          # It should be a fine-grained PAT scoped to BOTH
          # Axel-DaMage/joidy and Axel-DaMage/homebrew-tap with
          # "Contents: Read and write" — not a classic PAT (#1297).
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          SHA=$(curl -sL "https://github.com/Axel-DaMage/joidy/archive/refs/tags/${VERSION}.tar.gz" | sha256sum | cut -d' ' -f1)
          # homebrew-tap is public, so the clone needs no credentials.
          # Never embed the token in the clone URL: it would persist in
          # .git/config `remote.origin.url` and leak to any later git
          # command or log (#1297).
          git clone "https://github.com/Axel-DaMage/homebrew-tap.git"
          cd homebrew-tap
          sed -i "s|url \".*\"|url \"https://github.com/Axel-DaMage/joidy/archive/refs/tags/${VERSION}.tar.gz\"|" Formula/joidy.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/joidy.rb
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Formula/joidy.rb
          git diff --quiet HEAD || {
            git commit -m "joidy ${VERSION}"
            # Authenticate the push with a per-command http.extraheader —
            # the `-c` flag applies to this invocation only, so the token
            # is never written to .git/config, the remote URL, or the
            # credential store. Scoped to github.com so it cannot leak to
            # another host if the remote ever changes.
            AUTH_B64=$(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" push
          }

  # NOTE: AUR publishing lives in aur-publish.yml (release + workflow_dispatch).
  # It used to be duplicated here and both jobs raced on the same AUR repo —
  # the loser's push was rejected non-fast-forward and the release showed a
  # spurious failure (v1.1.0-beta.6). Keep AUR updates in ONE place.

  # Consumable SBOM + third-party license notices (#1386). Distinct from the
  # buildkit `sbom:` attestation tracked in #1297: this job produces
  # SPDX-JSON + CycloneDX-JSON documents a scanner can ingest, derives the
  # THIRD-PARTY-NOTICES license report required by MIT/Apache/BSD attribution
  # clauses, enforces the license policy (see scripts/check_licenses.py), and
  # attaches everything to the pushed images as OCI referrers plus to the
  # GitHub release as downloadable assets.
  #
  # Ordering caveat: `needs: docker` means images are already pushed when the
  # license check runs. A policy failure still fails the pipeline and blocks
  # the release assets — revoking a violating image tag is a manual
  # follow-up. Scanning pre-push would require restructuring the docker
  # matrix (build → load → scan → push); out of scope for #1386.
  sbom:
    name: SBOM & Third-Party Notices
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write # gh release upload
      # Attest the SBOM/notice assets to GitHub's attestation store (#1297).
      attestations: write
      id-token: write # OIDC token that signs the attestations
    env:
      # Input mapped to env — see the homebrew job for the #1295 rationale.
      VERSION: ${{ inputs.version || github.ref_name }}
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      SYFT_VERSION: '1.57.2' # consumed by scripts/generate_sbom.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image tag
        id: tag
        # docker/metadata-action emits the bare semver (v-stripped) for real
        # releases; on a bare dispatch without a version only :latest exists.
        run: |
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "tag=${VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # oras reads the docker config written by docker/login-action above,
      # so no separate registry login is needed for `oras attach`.
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: '1.3.6'

      - name: Generate per-service image SBOMs (SPDX-JSON + CycloneDX-JSON)
        # Scanning the pushed images captures the exact object code we
        # distribute — dist-info / package.json inside the image carry the
        # license metadata that requirements.txt lacks.
        run: |
          ./scripts/generate_sbom.sh --mode image \
            --image-prefix "$DOCKERHUB_USER" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --out-dir sbom

      - name: Enforce license policy
        # Policy families are documented in scripts/check_licenses.py:
        # DENIED (AGPL/SSPL/GPL-2.0-only/non-free CC/BUSL/proprietary) fails
        # the pipeline; weak copyleft (LGPL/MPL/EPL/CDDL) and undetected
        # licenses are reported as warnings.
        run: python3 scripts/check_licenses.py sbom/*.cdx.json

      - name: Generate THIRD-PARTY-NOTICES
        run: python3 scripts/generate_notices.py --output THIRD-PARTY-NOTICES.txt sbom/*.cdx.json

      - name: Attach SBOMs + notices as OCI referrers
        run: |
          set -euo pipefail
          for svc in api ai-service worker frontend; do
            IMG="${DOCKERHUB_USER}/joidy-${svc}"
            # Subject digest = sha256 of the pushed manifest/index content.
            DIGEST="sha256:$(docker buildx imagetools inspect "${IMG}:${{ steps.tag.outputs.tag }}" --raw | sha256sum | cut -d' ' -f1)"
            oras attach --artifact-type application/spdx+json \
              "${IMG}@${DIGEST}" "sbom/joidy-${svc}.spdx.json:application/spdx+json"
            oras attach --artifact-type application/vnd.cyclonedx+json \
              "${IMG}@${DIGEST}" "sbom/joidy-${svc}.cdx.json:application/vnd.cyclonedx+json"
            oras attach --artifact-type text/plain \
              "${IMG}@${DIGEST}" "THIRD-PARTY-NOTICES.txt:text/plain"
            oras discover "${IMG}@${DIGEST}" -o tree || true
          done

      - name: Upload SBOM assets to the GitHub release
        if: github.event_name == 'release' || inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" sbom/joidy-*.json THIRD-PARTY-NOTICES.txt --clobber

      # Artifact attestation (#1297): bind the SBOMs + license notices to
      # this workflow run in GitHub's attestation store. Consumers verify
      # with `gh attestation verify <file> --repo Axel-DaMage/joidy`.
      # Runs LAST so an attestation-API outage cannot block the release
      # asset upload above; a failure here still fails the job loudly.
      - name: Attest SBOM + notices provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            sbom/joidy-*.json
            THIRD-PARTY-NOTICES.txt

  # Keyless cosign signatures on the pushed images (#1297). Isolated in its
  # own job so a Sigstore (Fulcio/Rekor) outage fails ONLY this job — the
  # homebrew/sbom jobs depend on `docker`, not on `sign`, so release assets
  # and channel updates still ship. No secrets required: Fulcio issues the
  # signing certificate from the job's OIDC token (id-token: write), and
  # the signature is pushed to Docker Hub with the same registry login.
  sign:
    name: Cosign keyless image signing
    runs-on: ubuntu-latest
    needs: docker
    # No `if` gate: whatever the docker job pushed gets signed — release
    # tags on `release`, :latest on a bare dispatch. The digest logic
    # below resolves which tag to inspect.
    permissions:
      # OIDC token exchanged with Fulcio for the ephemeral signing cert.
      # This is the ONLY scope the job needs — no checkout, no GITHUB_TOKEN
      # writes; the registry push reuses the Docker Hub login below.
      id-token: write
    strategy:
      matrix:
        service: [api, frontend, ai-service, worker]
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # Pin the cosign binary too — the installer otherwise floats to
          # whatever "latest" is on release night.
          cosign-release: 'v3.1.4'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign image digest (keyless)
        run: |
          set -euo pipefail
          # Mirror the sbom job's tag resolution: real releases push the
          # bare semver (v-stripped) plus :latest; a bare dispatch only has
          # :latest. The signature binds the digest, so every tag pointing
          # at it (X.Y.Z, X.Y, latest) is covered by one signature.
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            TAG="${VERSION#v}"
          else
            TAG="latest"
          fi
          IMG="${DOCKERHUB_USER}/joidy-${{ matrix.service }}"
          # Same digest derivation as the sbom job's OCI-referrer attach:
          # sha256 of the manifest/index bytes the tag resolves to.
          DIGEST="sha256:$(docker buildx imagetools inspect "${IMG}:${TAG}" --raw | sha256sum | cut -d' ' -f1)"
          echo "Signing ${IMG}@${DIGEST} (tag ${TAG})"
          cosign sign --yes "${IMG}@${DIGEST}"

      - name: Verify signature locally
        run: |
          set -euo pipefail
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            TAG="${VERSION#v}"
          else
            TAG="latest"
          fi
          IMG="${DOCKERHUB_USER}/joidy-${{ matrix.service }}"
          DIGEST="sha256:$(docker buildx imagetools inspect "${IMG}:${TAG}" --raw | sha256sum | cut -d' ' -f1)"
          # Fulcio certs bind the workflow identity; consumers verify with
          # the same issuer + a repo-scoped identity regexp.
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "https://github.com/Axel-DaMage/joidy/.*" \
            "${IMG}@${DIGEST}"
