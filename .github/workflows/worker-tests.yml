name: Worker Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel in-flight runs for pull_request events. Push events on
  # main/development queue instead of cancelling, so merge storms keep the
  # post-merge signal for every commit (#1261).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: checkout + artifact upload need nothing beyond read.
# Fork PRs get a read-only token regardless; this keeps the declaration
# explicit instead of relying on repo defaults (#1297).
permissions:
  contents: read

jobs:
  worker:
    name: Worker Unit Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      LOG_DIR: logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install worker dependencies
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Coverage floor (#1259): the suite stays on `unittest discover`; it is
      # wrapped in `coverage run` instead of switching runners. See
      # worker/.coveragerc (source = ., omits tests/). Floor 60 = measured
      # ~65% on development (local run, 2026-11-20) rounded down with
      # headroom; ratchet up only.
      - name: Run worker tests with coverage
        working-directory: worker
        # Status capture (instead of plain `bash -e` short-circuit) keeps the
        # coverage report + floor check running even when tests fail, so a
        # red suite still emits the coverage signal.
        run: |
          python -m coverage run -m unittest discover -s tests -v || status=$?
          python -m coverage xml
          python -m coverage report -m --fail-under=60 || status=$?
          exit ${status:-0}

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-worker
          path: worker/coverage.xml
          retention-days: 30
