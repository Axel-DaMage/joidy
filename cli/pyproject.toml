[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joidy-cli"
version = "0.1.0"
description = "Interactive terminal client and agent-native interface for Joidy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Joidy contributors" }]
keywords = ["joidy", "cli", "pkm", "agent"]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "jmespath>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
joidy = "joidy_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["joidy_cli"]
