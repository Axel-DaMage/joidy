services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-joidy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-joidy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped

  api:
    image: ${DOCKER_REGISTRY:-d4mag3}/joidy-api:${IMAGE_TAG:-latest}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data/db:/data/db
      - ./data/uploads:/data/uploads
      # NOTE: api keeps .env read-write on purpose — routers/config.py persists
      # settings (e.g. GEMINI_API_KEY, OBSIDIAN_VAULT_PATH) to /app/.env.
      - ./.env:/app/.env
      - ${OBSIDIAN_VAULT_PATH:-./data/vault}:/vault
      # Docker socket for power management (sleep/wake/shutdown from web UI).
      # On Linux: ensure the container user can access the socket
      #   (set DOCKER_GID in .env to your host's docker group GID, or use 0 for root).
      # On Windows Docker Desktop: the socket is accessible by default.
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-joidy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-joidy}
      - AI_SERVICE_URL=http://ai-service:8002
      - WORKER_URL=http://worker:8001
      - APP_ENV=${APP_ENV:-production}
      - UPLOAD_DIR=/data/uploads
      - OBSIDIAN_VAULT_PATH=/vault
      - VAULT_PATH=/vault
      - DOCKER_SOCK_PATH=/var/run/docker.sock
    # Add the host's docker group so the app user can access the Docker socket.
    # Set DOCKER_GID in .env (find it with `getent group docker | cut -d: -f3` on Linux).
    group_add:
      - "${DOCKER_GID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
    restart: unless-stopped

  ai-service:
    image: ${DOCKER_REGISTRY:-d4mag3}/joidy-ai-service:${IMAGE_TAG:-latest}
    ports:
      - "${AI_SERVICE_PORT:-8002}:8002"
    volumes:
      - ./data/db:/data/db
      - ./.env:/app/.env:ro
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-joidy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-joidy}
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    restart: unless-stopped

  worker:
    image: ${DOCKER_REGISTRY:-d4mag3}/joidy-worker:${IMAGE_TAG:-latest}
    ports:
      - "${WORKER_PORT:-8001}:8001"
    volumes:
      - ./data/db:/data/db
      - ./.env:/app/.env:ro
      - ${OBSIDIAN_VAULT_PATH:-./data/vault}:/vault
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-joidy}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-joidy}
      - API_URL=http://api:8000
      - AI_SERVICE_URL=http://ai-service:8002
      - VAULT_PATH=/vault
      - APP_ENV=${APP_ENV:-production}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  frontend:
    image: ${DOCKER_REGISTRY:-d4mag3}/joidy-frontend:${IMAGE_TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=http://localhost:${API_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

volumes:
  postgres_data:
