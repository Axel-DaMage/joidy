services:
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: joidy-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    networks:
      - joidy

  grafana:
    image: grafana/grafana:11.0.0
    container_name: joidy-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required — set it in .env}
      # Auto-provision the Prometheus datasource and dashboards (#406).
      - GF_PROVISIONING_DATASOURCES=/etc/grafana/provisioning/datasources
      - GF_PROVISIONING_DASHBOARDS=/etc/grafana/provisioning/dashboards
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - joidy

networks:
  joidy:
    external: true

volumes:
  grafana-data:
