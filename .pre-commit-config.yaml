repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff pin in api/requirements-dev.txt (canonical parity
    # source) — enforced by the version-sync gate in scripts/lint.sh (#1586).
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      # Error severity matches the CI gate (dist-smoke.yml: `shellcheck -S
      # error`). Warning/info findings in the existing scripts are a known
      # baseline — tighten the level once they are ratcheted down (#1290).
      - id: shellcheck
        args: [ --severity=error ]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [ --baseline, .secrets.baseline ]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      # Copyright + license info for every file, via in-file SPDX headers or
      # REUSE.toml (#1384). Same version as the CI gate (reuse.yml).
      - id: reuse
  - repo: local
    hooks:
      - id: svelte-check
        name: svelte-check (typecheck)
        entry: bash -c 'cd frontend && npm run check'
        language: system
        files: ^frontend/.*\.(svelte|ts)$
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(svelte|ts|js)$
        pass_filenames: false
      # NOTE: prettier was removed from the frontend toolchain (#1257) — the
      # tree was never prettier-clean and nothing ran it, so the config was
      # dead weight. eslint + svelte-check remain the frontend gates.
