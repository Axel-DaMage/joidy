repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      # Error severity matches the CI gate (dist-smoke.yml: `shellcheck -S
      # error`). Warning/info findings in the existing scripts are a known
      # baseline — tighten the level once they are ratcheted down (#1290).
      - id: shellcheck
        args: [ --severity=error ]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [ --baseline, .secrets.baseline ]
  - repo: local
    hooks:
      - id: svelte-check
        name: svelte-check (typecheck)
        entry: bash -c 'cd frontend && npm run check'
        language: system
        files: ^frontend/.*\.(svelte|ts)$
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(svelte|ts|js)$
        pass_filenames: false
      - id: prettier
        name: prettier (check)
        entry: bash -c 'cd frontend && npm run format:check'
        language: system
        files: ^frontend/.*\.(svelte|ts|js|css|json)$
        pass_filenames: false
